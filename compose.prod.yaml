services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rahcar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private env file}
      POSTGRES_DB: rahcar
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rahcar -d rahcar"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your private env file}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in your private env file}
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    entrypoint: ["/app/worker"]
    command: ["-config", "/config/feeds.json"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your private env file}
      FEED_TOKEN: ${FEED_TOKEN:-}
    volumes:
      - ${FEED_CONFIG_PATH:-./approved-feeds.json}:/config/feeds.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["feeds"]

volumes:
  pgdata:
